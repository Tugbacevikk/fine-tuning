# ==============================================================================
# SES ANALİZİ PLATFORMU - DOCKER COMPOSE YAPILANDIRMASI
# ==============================================================================
services:
  # 1. FastAPI Web Sunucusu (REST API + Web UI)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio_analyzer_web:latest
    container_name: audio_analyzer_web
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_KEY=${API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-5000} # toplu feedback entegrasyonu için yüksek tutulmalı
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/audio_db}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0}
      - USE_REDIS_STREAM=true
      - STORAGE_TYPE=disk
      - STORAGE_DIR=/app/storage/raw
      - MODEL_DIR=/app/storage/models
      - DIARIZATION_ENGINE=${DIARIZATION_ENGINE:-sherpa_onnx}
      - DIARIZATION_ESCALATION=${DIARIZATION_ESCALATION:-off}
      - WHISPER_MODEL_SIZE=small
      - WORKER_CPU_THREADS=4
      - TARGET_NUM_SPEAKERS=${TARGET_NUM_SPEAKERS:-2}
      - HF_HOME=/app/storage/cache
    volumes:
      - audio_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # 2. Redis Stream Worker (Yüksek Performanslı Tüketici Grubu Worker)
  stream_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio_analyzer_stream_worker:latest
    restart: always
    command: python -m audio_analyzer.workers.stream_worker
    env_file: .env
    environment:
      - APP_ENV=production
      - API_KEY=${API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/audio_db}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0}
      - STORAGE_TYPE=disk
      - STORAGE_DIR=/app/storage/raw
      - MODEL_DIR=/app/storage/models
      - DIARIZATION_ENGINE=${DIARIZATION_ENGINE:-sherpa_onnx}
      - DIARIZATION_ESCALATION=${DIARIZATION_ESCALATION:-off}
      - WHISPER_MODEL_SIZE=small
      - WORKER_CPU_THREADS=4
      - TARGET_NUM_SPEAKERS=${TARGET_NUM_SPEAKERS:-2}
      - HF_HOME=/app/storage/cache
      - USE_LLM=false
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - OLLAMA_MODEL=llama3.2
    volumes:
      - audio_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # 3. Webhook Worker (Transactional Outbox Bildirim Servisi)
  webhook_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio_analyzer_webhook_worker:latest
    container_name: audio_analyzer_webhook_worker
    restart: always
    command: python -m audio_analyzer.workers.webhook_worker
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/audio_db}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 4. Sweeper Servisi (Yetim ve Askıda Kalan İşleri Toparlayıcı)
  sweeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: audio_analyzer_sweeper:latest
    container_name: audio_analyzer_sweeper
    restart: always
    command: python -m audio_analyzer.workers.sweeper
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/audio_db}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0}
      - STORAGE_TYPE=disk
      - STORAGE_DIR=/app/storage/raw
      - PENDING_STALE_SEC=300
      - PROCESSING_STALE_SEC=1800
      - MAX_JOB_ATTEMPTS=3
    volumes:
      - audio_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # 5. Tek Seferlik Veritabanı Migration Servisi
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio_analyzer_migrate
    command: alembic upgrade head
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/audio_db}
    depends_on:
      db:
        condition: service_healthy

  # 6. PostgreSQL Veritabanı
  db:
    image: postgres:16-alpine
    container_name: audio_analyzer_db
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-audio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-audio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 7. Redis Mesaj Brokerı & Önbellek
  redis:
    image: redis:7-alpine
    container_name: audio_analyzer_redis
    restart: always
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}

volumes:
  postgres_data:
  audio_storage:
