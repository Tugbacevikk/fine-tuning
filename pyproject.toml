[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-analyzer"
version = "0.1.0"
description = "High-performance Audio Analysis (STT + Speaker Diarization) System"
authors = [
    { name = "Tuğba Çevik" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "soundfile>=0.12.1",
    "speechbrain>=0.5.16",
    "pydantic>=2.5.0",
    "av>=11.0.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    "redis>=5.0.1",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
    "faster-whisper>=1.0.0",
    "silero-vad>=5.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
sherpa = [
    "sherpa-onnx>=1.10.0",
]
pyannote = [
    "pyannote.audio>=4.0.0,<5.0.0",
]
denoise = [
    "deepfilternet>=0.5.0",
]
s3 = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "fakeredis>=2.20.0,<2.26.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[project.scripts]
audio-analyzer-api = "audio_analyzer.api.main:start"
audio-analyzer-stream-worker = "audio_analyzer.workers.stream_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "system: End-to-end system tests",
    "benchmark: Performance benchmark tests",
    "torch: Tests requiring PyTorch models",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "src"
files = ["src"]

